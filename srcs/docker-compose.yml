version: "3.8"

services:
  nginx:
    container_name: nginx
    build: requirements/nginx/.
    restart: always
    ports:
      -443:443

  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb/.
    restart: always
    ports:
      -3306:3306
    environment:
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress/.
    restart: always
    ports:
      -9000:9000
    depends_on:
      - mariadb
    env file:
      - .env